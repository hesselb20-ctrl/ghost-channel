<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 464" width="800" height="464" role="img" aria-label="Data flow. On the sender page: a demo scene, image, video, webcam or shared screen is the picture; the payload is packed into a container, protected with Reed-Solomon and a fountain code; a WebGL2 shader adds a 20 Hz carrier whose phase carries two bits per cell. On the receiver page: the camera frames go to a Web Worker, the screen is found by its carrier power or by corners placed by hand, and the grid and symbol timing are locked with pilot cells. Then each cell is demodulated, errors are corrected, and a link is shown to open on tap or a file offered as a download.">
<style>
.s{font-family:'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
.ink{fill:#111111}.mute{fill:#5F5F5F}.acc{fill:#000000}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes fade{0%,100%{opacity:0}35%,65%{opacity:1}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(var(--d))}}
.pulse{animation:pulse 4s ease-in-out infinite}
.flow{stroke-dasharray:3 9;animation:dash 6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="800" height="464" rx="3" fill="#F5F5F5"/>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E8E8E8" stroke-width="1"/></pattern></defs>
<rect width="800" height="464" rx="3" fill="url(#g)"/>
<path d="M24 14H14V24" fill="none" stroke="#5F5F5F" stroke-width="1"/><path d="M776 14H786V24" fill="none" stroke="#5F5F5F" stroke-width="1"/><path d="M24 450H14V440" fill="none" stroke="#5F5F5F" stroke-width="1"/><path d="M776 450H786V440" fill="none" stroke="#5F5F5F" stroke-width="1"/>
<text x="36" y="54" class="m" font-size="10.5"><tspan class="acc">A</tspan><tspan class="mute" dx="10">Sender page</tspan></text><line x1="156.2" y1="50" x2="764" y2="50" stroke="#E8E8E8"/><rect x="36" y="72" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:0.00s" cx="52" cy="93" r="3" fill="#000000"/>
<text x="64" y="97" class="m ink" font-size="11" font-weight="600">Picture</text>
<text x="52" y="119" class="s mute" font-size="12">demo scene, image, video,</text>
<text x="52" y="135" class="s mute" font-size="12">webcam or shared screen</text><path class="flow" d="M252 111H287" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M286 107l5 4l-5 4" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="292" y="72" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:0.45s" cx="308" cy="93" r="3" fill="#000000"/>
<text x="320" y="97" class="m ink" font-size="11" font-weight="600">Encode</text>
<text x="308" y="119" class="s mute" font-size="12">container, Reed-Solomon,</text>
<text x="308" y="135" class="s mute" font-size="12">fountain code, CRC-32</text><path class="flow" d="M508 111H543" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M542 107l5 4l-5 4" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="548" y="72" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:0.90s" cx="564" cy="93" r="3" fill="#000000"/>
<text x="576" y="97" class="m ink" font-size="11" font-weight="600">Modulate</text>
<text x="564" y="119" class="s mute" font-size="12">WebGL2, 20 Hz carrier</text>
<text x="564" y="135" class="s mute" font-size="12">QPSK phase per cell</text><path class="flow" d="M656 150V172H226V207" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M222 206l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><text x="36" y="194" class="m" font-size="10.5"><tspan class="acc">B</tspan><tspan class="mute" dx="10">Receiver page</tspan></text><line x1="172.6" y1="190" x2="764" y2="190" stroke="#E8E8E8"/><rect x="36" y="212" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:1.35s" cx="52" cy="233" r="3" fill="#000000"/>
<text x="64" y="237" class="m ink" font-size="11" font-weight="600">Camera</text>
<text x="52" y="259" class="s mute" font-size="12">30 fps sees 20 Hz as 10 Hz</text>
<text x="52" y="275" class="s mute" font-size="12">frames to a Web Worker</text><path class="flow" d="M252 251H287" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M286 247l5 4l-5 4" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="292" y="212" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:1.80s" cx="308" cy="233" r="3" fill="#000000"/>
<text x="320" y="237" class="m ink" font-size="11" font-weight="600">Find screen</text>
<text x="308" y="259" class="s mute" font-size="12">carrier power, no markers</text>
<text x="308" y="275" class="s mute" font-size="12">or corners placed by hand</text><path class="flow" d="M508 251H543" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M542 247l5 4l-5 4" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="548" y="212" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:2.25s" cx="564" cy="233" r="3" fill="#000000"/>
<text x="576" y="237" class="m ink" font-size="11" font-weight="600">Lock grid</text>
<text x="564" y="259" class="s mute" font-size="12">checker energy, pilot check</text>
<text x="564" y="275" class="s mute" font-size="12">symbol timing</text><path class="flow" d="M656 290V312H226V347" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M222 346l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><text x="36" y="334" class="m" font-size="10.5"><tspan class="acc">C</tspan><tspan class="mute" dx="10">Decode</tspan></text><line x1="115.19999999999999" y1="330" x2="764" y2="330" stroke="#E8E8E8"/><rect x="36" y="352" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:2.70s" cx="52" cy="373" r="3" fill="#000000"/>
<text x="64" y="377" class="m ink" font-size="11" font-weight="600">Demodulate</text>
<text x="52" y="399" class="s mute" font-size="12">fit DC, I and Q per cell</text>
<text x="52" y="415" class="s mute" font-size="12">pilots give the phase</text><path class="flow" d="M252 391H287" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M286 387l5 4l-5 4" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="292" y="352" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:3.15s" cx="308" cy="373" r="3" fill="#000000"/>
<text x="320" y="377" class="m ink" font-size="11" font-weight="600">Correct</text>
<text x="308" y="399" class="s mute" font-size="12">Reed-Solomon with erasures</text>
<text x="308" y="415" class="s mute" font-size="12">CRC-32, fountain decoder</text><path class="flow" d="M508 391H543" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M542 387l5 4l-5 4" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="548" y="352" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:3.60s" cx="564" cy="373" r="3" fill="#000000"/>
<text x="576" y="377" class="m ink" font-size="11" font-weight="600">Show</text>
<text x="564" y="399" class="s mute" font-size="12">link opens only on a tap</text>
<text x="564" y="415" class="s mute" font-size="12">file offered as a download</text>
</svg>